<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .shake { animation: shake 0.3s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .spinner {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gradient-to-r from-blue-50 to-blue-100 font-sans min-h-screen relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-blue-200 via-blue-100 to-white opacity-30 animate-pulse z-0"></div>

    <nav class="bg-blue-600 text-white shadow-md relative z-10">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="{% url 'dashboard' %}" class="text-2xl font-bold hover:text-blue-200 transition duration-300">Financial Tracker</a>
            <div class="space-x-4">
                {% if user.is_authenticated %}
                    <a href="{% url 'upload_details' %}" class="hover:bg-blue-700 px-3 py-2 rounded transition duration-300 transform hover:scale-105">Upload Details</a>
                    <a href="{% url 'history' %}" class="hover:bg-blue-700 px-3 py-2 rounded transition duration-300 transform hover:scale-105">History</a>
                    <a href="{% url 'download_report' %}" class="hover:bg-blue-700 px-3 py-2 rounded transition duration-300 transform hover:scale-105">Download Report</a>
                    <a href="{% url 'logout' %}" class="hover:bg-blue-700 px-3 py-2 rounded transition duration-300 transform hover:scale-105">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="hover:bg-blue-700 px-3 py-2 rounded transition duration-300 transform hover:scale-105">Login</a>
                    <a href="{% url 'signup' %}" class="hover:bg-blue-700 px-3 py-2 rounded transition duration-300 transform hover:scale-105">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="relative z-10 container mx-auto px-4 py-6 fade-in">
        {% block content %}{% endblock %}
    </div>

    <script>
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', () => {
                const button = form.querySelector('button[type=\"submit\"]');
                const spinner = form.querySelector('.spinner');
                if (spinner) {
                    button.disabled = true;
                    spinner.style.display = 'inline-block';
                }
            });
        });
    </script>
</body>
</html>
